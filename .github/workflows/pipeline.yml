# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:

    name: Run Build
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v5

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.

  ui-tests:

    name: Run Tests

    runs-on: ubuntu-latest

    steps:
      # Step 1: Get the code
      - uses: actions/checkout@v5

      # Step 2: Set up Node.js
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Step 3: Install project dependencies
      - run: npm i playwright

      # Step 4: Install Playwright browsers
      - run: npx playwright install --with-deps

      # Step 5: Run the test browsers installed
      - name: Run a one-line script
        run: npx playwright test 

  # Job: Run all DummyJSON API exercise collections through Newman
  api-tests:

    name: Run API Tests (Newman)

    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository so Newman can access the collection files
      - uses: actions/checkout@v5

      # Step 2: Set up the Node.js runtime required by Newman
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Step 3: Install Newman CLI and the htmlextra reporter for rich HTML output
      - name: Install Newman and htmlextra reporter
        run: npm install -g newman newman-reporter-htmlextra

      # Step 4: Create the output directory where HTML reports will be saved
      - name: Create reports directory
        run: mkdir -p newman-reports

      # Step 5: Exercise 1 — GET requests, query parameters, and field selection
      - name: Exercise 1 - Explore the Products API
        id: ex1
        run: |
          newman run postman/exercise1-products-api.postman_collection.json \
            --environment postman/dummyjson-environment.json \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export newman-reports/exercise1-products-report.html \
            --reporter-htmlextra-title "Exercise 1 - Products API"
        continue-on-error: true

      # Step 6: Exercise 2 — boundary and invalid input testing using status codes
      - name: Exercise 2 - Test Status Codes Systematically
        id: ex2
        run: |
          newman run postman/exercise2-status-codes.postman_collection.json \
            --environment postman/dummyjson-environment.json \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export newman-reports/exercise2-status-codes-report.html \
            --reporter-htmlextra-title "Exercise 2 - Status Codes"
        continue-on-error: true

      # Step 7: Exercise 3 — full CRUD lifecycle on the Todos resource
      - name: Exercise 3 - CRUD on Todos
        id: ex3
        run: |
          newman run postman/exercise3-crud-todos.postman_collection.json \
            --environment postman/dummyjson-environment.json \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export newman-reports/exercise3-crud-todos-report.html \
            --reporter-htmlextra-title "Exercise 3 - CRUD on Todos"
        continue-on-error: true

      # Step 8: Exercise 4 — JWT authentication flow and all auth edge cases
      - name: Exercise 4 - Authentication Flow
        id: ex4
        run: |
          newman run postman/exercise4-auth-flow.postman_collection.json \
            --environment postman/dummyjson-environment.json \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export newman-reports/exercise4-auth-flow-report.html \
            --reporter-htmlextra-title "Exercise 4 - Authentication Flow"
        continue-on-error: true

      # Step 9: Exercise 5 — pagination boundaries, invariant checks, and edge cases
      - name: Exercise 5 - Pagination Deep Dive
        id: ex5
        run: |
          newman run postman/exercise5-pagination.postman_collection.json \
            --environment postman/dummyjson-environment.json \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export newman-reports/exercise5-pagination-report.html \
            --reporter-htmlextra-title "Exercise 5 - Pagination Deep Dive"
        continue-on-error: true

      # Step 10: Gate step — fails the job if any exercise collection had test failures.
      #          Runs even when prior steps fail (continue-on-error) so all collections always execute.
      #          Uses step outcome (raw result before continue-on-error) to detect real failures.
      - name: Fail if any exercise had test failures
        if: always()
        run: |
          FAILED=0
          if [ "${{ steps.ex1.outcome }}" = "failure" ]; then echo "Exercise 1 FAILED"; FAILED=1; fi
          if [ "${{ steps.ex2.outcome }}" = "failure" ]; then echo "Exercise 2 FAILED"; FAILED=1; fi
          if [ "${{ steps.ex3.outcome }}" = "failure" ]; then echo "Exercise 3 FAILED"; FAILED=1; fi
          if [ "${{ steps.ex4.outcome }}" = "failure" ]; then echo "Exercise 4 FAILED"; FAILED=1; fi
          if [ "${{ steps.ex5.outcome }}" = "failure" ]; then echo "Exercise 5 FAILED"; FAILED=1; fi
          if [ "$FAILED" -eq 1 ]; then
            echo "One or more Newman exercises had test failures. See the HTML reports in the artifact."
            exit 1
          fi
          echo "All exercises passed."

      # Step 11: Upload all generated HTML reports as a downloadable workflow artifact.
      #          Runs even when individual exercise steps fail so reports are always available.
      - name: Upload Newman Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-test-reports
          path: newman-reports/
          retention-days: 30
